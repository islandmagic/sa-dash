name: Generate dashboard

on:
  push:
    branches: [master]
    paths:
      - "content/breaking_news.md"
      - "data/cache/marinetraffic_kauai.json"
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MARINETRAFFIC_DEBUG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate pages
        run: python3 -m src.generate --island kauai
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          HCDP_API_KEY: ${{ secrets.HCDP_API_KEY }}
          WINLINK_API_KEY: ${{ secrets.WINLINK_API_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_IMAP_HOST: ${{ secrets.MAIL_IMAP_HOST }}
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_OWNER_FROM: ${{ secrets.MAIL_OWNER_FROM }}
          WINLINK_TO: ${{ secrets.WINLINK_TO }}
          EVENT_MODE: ${{ vars.EVENT_MODE }}
          DIGEST_SEND_HOURS_HST: ${{ vars.DIGEST_SEND_HOURS_HST }}
      - name: Commit alert cache and event state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/county_alerts.json data/state/event.json || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update county alerts cache and event state"
            git pull --rebase origin master || true
            git push origin master
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
